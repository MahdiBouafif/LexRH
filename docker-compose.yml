services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lexrh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexrh}
      POSTGRES_DB: lexrh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexrh -d lexrh"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://lexrh:${POSTGRES_PASSWORD:-lexrh}@postgres:5432/lexrh
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn lexrh.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:

# Langfuse is added in week 4 (observability); see docs/SCOPE.md.
